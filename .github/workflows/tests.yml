name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      # node:test nativo, sin dependencias. Los tests no salen a la red ni
      # firman nada: usan un certificado de mentira y fixtures de respuestas
      # reales de ARCA ya capturadas.
      - run: npm test
